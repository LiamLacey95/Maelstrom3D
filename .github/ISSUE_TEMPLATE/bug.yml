name: Bug report
description: Something in Maelstrom3D doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Help > Report a Bug...** in Maelstrom3D opens this form with the version, system and
        log already filled in. Maelstrom3D is an early alpha: please check the open issues first.
  - type: textarea
    id: steps
    attributes:
      label: What happened
      description: What you did, step by step, what you expected and what happened instead. Screenshots help.
      placeholder: |
        1. F2 (Sculpt) on the default cube
        2. ...
        Expected: ...
        Happened: ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Maelstrom3D version
      description: Help > About Maelstrom3D, or the right end of the status bar.
      placeholder: Maelstrom3D alpha m3d.5 (Blender 5.2.2)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11
  - type: input
    id: gpu
    attributes:
      label: Graphics card
      placeholder: NVIDIA GeForce RTX 3060 (OpenGL)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of m3d_log.txt (Help > Open Log Folder). After a crash, attach the crash log too (Help > Open Crash Log).
      render: text
  - type: textarea
    id: file
    attributes:
      label: Files
      description: If you can, attach a small .blend file that shows the problem (zip it first).
